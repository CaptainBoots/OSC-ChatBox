name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 requests

      - name: Extract Version
        id: get_version
        run: |
          $version = python -c "import re; content=open('ProtoTool-Launcher/ProtoTool-Launcher.py', 'r', encoding='utf-8').read(); print(re.search(r'VERSION\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]', content).group(1))"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Extracted version: $version"

      - name: Check if Release Exists
        id: check_release
        run: |
          $headers = @{ "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
          $url = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$env:VERSION"
          try {
              $response = Invoke-WebRequest -Uri $url -Headers $headers -Method Head -UseBasicParsing
              $status = $response.StatusCode
          } catch {
              # If the request fails (e.g. 404), extract status code from exception
              if ($_.Exception.Response) {
                  $status = $_.Exception.Response.StatusCode.value__
              } else {
                  $status = 0
              }
          }
          if ($status -eq 200) {
              Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_EXISTS=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=true"
              Write-Host "Release v$env:VERSION already exists. Skipping build."
          } else {
              Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_EXISTS=false"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=false"
              Write-Host "Release v$env:VERSION does not exist. Proceeding with build."
          }

      - name: Build Executable
        if: env.RELEASE_EXISTS != 'true'
        run: |
          cd ProtoTool-Launcher
          python -m PyInstaller --noconfirm ProtoTool-Launcher.spec
          python -m PyInstaller --noconfirm ProtoTool-Uninstaller.spec

      - name: Install Qt6 SDK
        if: env.RELEASE_EXISTS != 'true'
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --outputdir C:/Qt

      - name: Build C++ Executables
        if: env.RELEASE_EXISTS != 'true'
        run: |
          cd SynthTool-Launcher
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.8.0/msvc2022_64" ..
          cmake --build . --config Release

      - name: Package C++ Executables
        if: env.RELEASE_EXISTS != 'true'
        run: |
          & "C:/Qt/6.8.0/msvc2022_64/bin/windeployqt.exe" --no-compiler-runtime SynthTool-Launcher/build/Release/SynthTool-Launcher.exe
          & "C:/Qt/6.8.0/msvc2022_64/bin/windeployqt.exe" --no-compiler-runtime SynthTool-Launcher/build/Release/SynthTool-Uninstaller.exe
          
          # Create a temporary directory to package only the launcher and its deployed DLLs
          New-Item -ItemType Directory -Force -Path temp_package
          Copy-Item -Path SynthTool-Launcher/build/Release/* -Destination temp_package -Recurse
          
          # Exclude the uninstaller from the portable zip folder
          Remove-Item -Path temp_package/SynthTool-Uninstaller.exe -Force
          
          # Compress the package and clean up
          Compress-Archive -Path temp_package/* -DestinationPath SynthTool-Launcher-Portable.zip
          Remove-Item -Path temp_package -Recurse -Force

      - name: Create GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            ProtoTool-Launcher/dist/ProtoTool-Launcher.exe
            ProtoTool-Launcher/dist/ProtoTool-Uninstaller.exe
            SynthTool-Launcher-Portable.zip
            SynthTool-Launcher/build/Release/SynthTool-Uninstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
