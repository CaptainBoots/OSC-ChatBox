name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 requests

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "
          import re
          with open('VRChat-ToolBox.py', 'r', encoding='utf-8') as f:
              for line in f:
                  if line.strip().startswith('VERSION ='):
                      match = re.search(r'[\"\\\']([^\"\\\']+)[\"\\\']', line)
                      if match:
                          print(match.group(1))
                          break
          ")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if Release Exists
        id: check_release
        shell: bash
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.VERSION }}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ env.VERSION }} already exists. Skipping build."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ env.VERSION }} does not exist. Proceeding with build."
          fi

      - name: Build Executable
        if: env.RELEASE_EXISTS != 'true'
        run: |
          python -m PyInstaller --noconfirm ToolBox.spec

      - name: Create GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/ToolBox.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
